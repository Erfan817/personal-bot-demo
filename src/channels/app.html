<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="/manifest.webmanifest">
<title>Erifane</title>
<style>
  :root { color-scheme: dark; --bg:#0e1014; --panel:#161a22; --bubble:#1e2430; --me:#2b4a75; --text:#e8eaf0; --dim:#8a93a6; --acc:#5b9dff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, "PingFang SC", "MiSans", sans-serif; display: flex; flex-direction: column; }
  header { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #232936; background: var(--panel); }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4152; }
  header .dot.on { background: #38c172; }
  header b { font-size: 17px; }
  header span { color: var(--dim); font-size: 12px; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 5px; }
  .bot { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 5px; }
  .sys { align-self: center; color: var(--dim); font-size: 12px; background: none; padding: 2px; }
  .proc { align-self: flex-start; color: var(--dim); font-size: 12.5px; background: none; padding: 0 6px; }
  #bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid #232936; }
  #in { flex: 1; background: var(--bubble); border: 1px solid #2a3140; color: var(--text); border-radius: 22px; padding: 11px 16px; font: inherit; outline: none; }
  #in:focus { border-color: var(--acc); }
  #send { background: var(--acc); color: #fff; border: 0; border-radius: 22px; padding: 0 18px; font: inherit; font-weight: 600; }
  #send:disabled { opacity: .45; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; gap: 12px; padding: 40px 28px; justify-content: center; }
  #gate h1 { font-size: 20px; }
  #gate p { color: var(--dim); font-size: 13.5px; }
  #gate input { background: var(--bubble); border: 1px solid #2a3140; color: var(--text); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; }
  #gate button { background: var(--acc); color: #fff; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="dot" id="conn"></div><b>Erifane</b><span id="status">连接中…</span>
</header>
<div id="log"></div>
<div id="bar">
  <input id="in" placeholder="发消息给 Erifane…" autocomplete="off" enterkeyhint="send">
  <button id="send">发送</button>
</div>
<div id="gate" class="hidden">
  <h1>Erifane</h1>
  <p>首次使用：粘贴服务器 .env 里的 APP_API_TOKEN。Token 只存在本机。</p>
  <input id="tk" placeholder="APP_API_TOKEN" autocomplete="off">
  <button id="tksave">连接</button>
  <p id="tkerr" style="color:#ff7b72"></p>
</div>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("in"), send = $("send");
const store = window.localStorage;
let token = store.getItem("app_token") || "";
let busy = false;

const scroll = () => { log.scrollTop = log.scrollHeight; };
const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d); scroll(); return d; };

// ── Token 门 ──
function showGate(err) { $("gate").classList.remove("hidden"); $("tkerr").textContent = err || ""; }
if (!token) showGate();

$("tksave").onclick = () => { token = $("tk").value.trim(); if (!token) return; store.setItem("app_token", token); $("gate").classList.add("hidden"); boot(); };

// ── 历史 ──
async function loadHistory() {
  try {
    const r = await fetch("/history?limit=60", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) return;
    const { messages } = await r.json();
    (messages || []).forEach((m) => add(m.role === "user" ? "me" : "bot", m.content));
    if (messages?.length) add("sys", "以上是历史消息");
  } catch {}
}

// ── SSE ──
let es = null;
function connect() {
  es = new EventSource("/stream?t=" + encodeURIComponent(token));
  es.onopen = () => { $("conn").classList.add("on"); $("status").textContent = "在线"; };
  es.onerror = () => { $("conn").classList.remove("on"); $("status").textContent = "重连中…"; };
  es.addEventListener("step", (e) => setProc("思考中（第 " + JSON.parse(e.data).n + " 轮）…"));
  es.addEventListener("tool_call", (e) => { const d = JSON.parse(e.data); setProc("🔧 " + d.name); });
  es.addEventListener("answer", (e) => { const d = JSON.parse(e.data); clearProc(); add("bot", d.text); busy = false; send.disabled = false; });
  es.addEventListener("deliver", (e) => { const d = JSON.parse(e.data); clearProc(); add("bot", d.text); });
}

let procEl = null;
const setProc = (t) => { if (!procEl) { procEl = document.createElement("div"); procEl.className = "proc"; log.appendChild(procEl); } procEl.textContent = t; scroll(); };
const clearProc = () => { procEl?.remove(); procEl = null; };

// ── 发送 ──
async function sendMsg() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  add("me", text); input.value = "";
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ text, messageId: crypto.randomUUID() }),
    });
    if (r.status === 401) { showGate("Token 无效，重新粘贴"); store.removeItem("app_token"); busy = false; send.disabled = false; return; }
    setProc("已收到，处理中…");
  } catch (e) { add("sys", "网络错误：" + e.message); busy = false; send.disabled = false; }
}
send.onclick = sendMsg;
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });

function boot() { connect(); loadHistory(); input.focus(); }
if (token) boot();
</script>
</body>
</html>
